services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lostfound
    ports:
      - "5440:5432"
    volumes:
      - lostfound-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lostfound"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  lostfound-data:
